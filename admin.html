<body data-page="admin">
<div class="scroll-progress" id="progress"></div>

<!-- ==================== LOGIN GATE (glassmorphism) ==================== -->
<div class="admin-gate" id="adminGate">
  <div class="login-card">
    <img class="login-logo" src="images/logo.png" alt="Urban Mark Creatives logo" width="350" height="238">
    <h1>Welcome back</h1>
    <p>Sign in to manage the Urban Mark Creatives website.</p>

    <form id="loginForm" novalidate>
      <label class="login-field">
        <span>Email or username</span>
        <i class="fa-solid fa-envelope lead-icon"></i>
        <input type="text" id="loginUser" name="username" placeholder="admin" autocomplete="username" required>
      </label>

      <label class="login-field">
        <span>Password</span>
        <i class="fa-solid fa-lock lead-icon"></i>
        <input type="password" id="loginPass" name="password" placeholder="••••••••" autocomplete="current-password" required>
        <button class="login-eye" id="togglePass" type="button" aria-label="Show password">
          <i class="fa-solid fa-eye"></i>
        </button>
      </label>

      <div class="login-row">
        <label class="login-check">
          <input type="checkbox" id="rememberMe" checked>
          <span>Remember me</span>
        </label>
        <a href="#" id="forgotLink">Forgot password?</a>
      </div>

      <button class="login-btn" type="submit">Login</button>
      <div class="login-error" id="loginError" hidden></div>
    </form>

    <p class="login-foot">
      This dashboard runs entirely in your browser. Changes are saved to local storage
      and published by exporting <code>data.json</code> to your repository.<br>
      <a href="index.html">&larr; Back to the website</a>
    </p>
  </div>
</div>

<!-- ==================== DASHBOARD ==================== -->
<div class="admin-app" id="adminApp" hidden>
  <div class="admin-shell">

    <aside class="admin-side">
      <a class="brand" href="index.html">
        <img src="images/logo.png" alt="Urban Mark Creatives" width="350" height="238">
        <span class="brand-text">
          <b>Urban Mark</b>
          <small>Admin</small>
        </span>
      </a>

      <nav class="admin-tabs" aria-label="Dashboard sections">
        <button type="button" class="on" data-tab="site"><i class="fa-solid fa-building"></i> Brand &amp; site</button>
        <button type="button" data-tab="hero"><i class="fa-solid fa-star"></i> Hero</button>
        <button type="button" data-tab="services"><i class="fa-solid fa-layer-group"></i> Services</button>
        <button type="button" data-tab="portfolio"><i class="fa-solid fa-images"></i> Portfolio</button>
        <button type="button" data-tab="team"><i class="fa-solid fa-users"></i> Team</button>
        <button type="button" data-tab="testimonials"><i class="fa-solid fa-quote-left"></i> Testimonials</button>
        <button type="button" data-tab="faq"><i class="fa-solid fa-circle-question"></i> FAQs</button>
        <button type="button" data-tab="pricing"><i class="fa-solid fa-tags"></i> Pricing</button>
        <button type="button" data-tab="contact"><i class="fa-solid fa-address-book"></i> Contact</button>
        <button type="button" data-tab="seo"><i class="fa-solid fa-magnifying-glass-chart"></i> SEO manager</button>
        <button type="button" data-tab="tracking"><i class="fa-solid fa-chart-simple"></i> Tracking</button>
        <button type="button" data-tab="account"><i class="fa-solid fa-gear"></i> Account</button>
      </nav>

      <div class="admin-side-foot">
        <a href="index.html" target="_blank" rel="noopener"><i class="fa-solid fa-arrow-up-right-from-square"></i> View live site</a>
        <button type="button" id="logoutBtn"><i class="fa-solid fa-right-from-bracket"></i> Sign out</button>
      </div>
    </aside>

    <main class="admin-main">
      <div class="admin-top">
        <h1>Content dashboard</h1>
        <div class="btn-row">
          <button class="btn btn-sm btn-outline" type="button" id="resetBtn">
            <i class="fa-solid fa-rotate-left"></i> Reset
          </button>
          <button class="btn btn-sm" type="button" id="exportBtn">
            <i class="fa-solid fa-download"></i> Export data.json
          </button>
          <button class="btn btn-sm" type="button" id="saveBtn">
            <i class="fa-solid fa-floppy-disk"></i> Save &amp; Preview Live
          </button>
        </div>
      </div>

      <div class="admin-status" id="adminStatus"></div>
      <div id="tabBody"></div>
    </main>

  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="art.js" defer></script>
<script src="app.js" defer></script>
<script>
/* Forgot-password helper: this is a browser-only gate, so explain the reset path */
document.addEventListener("DOMContentLoaded", function () {
  var f = document.getElementById("forgotLink");
  if (f) f.addEventListener("click", function (e) {
    e.preventDefault();
    alert(
      "This dashboard is a browser-only content editor, so there is no email reset.\n\n" +
      "To reset the password: open your browser's developer console on this page and run\n\n" +
      "  localStorage.removeItem('umc_admin_pass')\n\n" +
      "then reload. The default password is urbanmarkcreatives2026 — change it in the Account tab."
    );
  });
});
</script>
</body>
</html>
